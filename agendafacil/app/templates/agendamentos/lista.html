{% extends "base.html" %}
{% block titulo %}Agendamentos{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <h1>Agendamentos</h1>
  <a class="botao" href="{{ url_for('agendamentos.novo') }}">+ Novo agendamento</a>
</div>
<form method="get" class="filtro">
  <input type="date" name="data" value="{{ data }}" aria-label="Filtrar por data">
  <select name="status" aria-label="Filtrar por status">
    <option value="">Todos os status</option>
    {% for s in ['AGENDADO', 'CONCLUIDO', 'CANCELADO'] %}
      <option value="{{ s }}" {{ 'selected' if status == s }}>{{ s|capitalize }}</option>
    {% endfor %}
  </select>
  <button class="botao secundario">Filtrar</button>
</form>
{% include "agendamentos/_tabela.html" with context %}
{% endblock %}

{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<form method="post" class="formulario" novalidate data-validar>
  <label>Nome *
    <input type="text" name="nome" value="{{ s.nome or '' }}" required minlength="3" maxlength="80">
  </label>
  <label>Descrição
    <input type="text" name="descricao" value="{{ s.descricao or '' }}" maxlength="255">
  </label>
  <div class="linha">
    <label>Preço (R$) *
      <input type="number" name="preco" value="{{ s.preco or '' }}" required min="0.01" step="0.01">
    </label>
    <label>Duração (min) *
      <input type="number" name="duracao_min" value="{{ s.duracao_min or '' }}" required min="5" max="480" step="5">
    </label>
  </div>
  <div class="acoes">
    <button class="botao">Salvar</button>
    <a class="botao secundario" href="{{ url_for('servicos.index') }}">Voltar</a>
  </div>
</form>
{% endblock %}
